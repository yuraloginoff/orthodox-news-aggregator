<!-- public/admin.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка Глас</title>

<link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
<link rel="shortcut icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
<link rel="manifest" href="/img/site.webmanifest" />

<link rel="stylesheet" href="css/normalize.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header>
    <h1><a href="/">Глас</a></h1>
    <div class="filters">
      <select id="sourceFilter">
        <option value="">Все источники</option>
      </select>
      <select id="statusFilter">
        <option value="unsent">Не отправленные</option>
        <option value="sent">Отправленные</option>
        <option value="">Все</option>
      </select>
      <select id="dateFilter">
        <option value="">Все новости</option>
        <option value="today">Сегодня</option>
        <option value="yesterday">Вчера</option>
      </select>
      <button id="refreshBtn">Обновить</button>
    </div>
  </header>

  <main id="newsList">
    <p class="loading">Загрузка...</p>
  </main>

  <footer>
    <button id="prevPage">&larr; Назад</button>
    <span id="pageInfo"></span>
    <button id="nextPage">Вперёд &rarr;</button>
  </footer>

  <script src="js/admin.js"></script>
</body>
</html>
