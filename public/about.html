<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глас • О сайте</title>
  <meta name="description" content="Единая лента новостей православных епархий, патриархии и церковных СМИ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="shortcut icon" href="/img/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/img/site.webmanifest" />
  <link rel="stylesheet" href="/css/normalize.css">
  <link rel="stylesheet" href="/css/site.css">
</head>

<body>
  <a href="#main" class="sr-only">Перейти к содержимому</a>

  <header>
    <div class="header-cont">
      <h1 class="logo-wrap">
        <a href="/" class="logo" aria-label="Глас — на главную">Глас <span>•</span> <em>Православные новости</em></a>
      </h1>

      <div class="header__links">
        <nav><a href="/about.html" class="nav-link current">О сайте</a></nav>

        <a class="tg-link" href="https://t.me/glas_news" target="_blank" rel="noopener noreferrer" aria-label="Telegram" style="display:none"></a>
        <button id="themeToggle" class="theme-toggle" aria-label="Переключить тему" type="button"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero">
        <div class="hero-img">
            <img src="/img/patriarh.jpg"alt="Святейший Патриарх Московский и всея Руси Кирилл">
        </div>
        <h1>Православные новости <span>в&nbsp;одной ленте</span></h1>
        <p>Патриархия, епархии, церковные СМИ — свежие новости за&nbsp;1—2 минуты. Полный текст открывается на сайте первоисточника.</p>
    </section>
  </main>


    <script>
    (function () {
    const toggle = document.getElementById('themeToggle');
    const root = document.documentElement;
    let theme = localStorage.getItem('theme');
    if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);

    function renderIcon() {
        toggle.innerHTML = theme === 'dark'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему');
    }

    renderIcon();
    toggle.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', theme);
        root.setAttribute('data-theme', theme);
        renderIcon();
    });
    })();
    </script>

</body>
</html>
