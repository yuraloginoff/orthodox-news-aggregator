<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глас • Православные Новости</title>
  <meta name="description" content="Единая лента новостей православных епархий, патриархии и церковных СМИ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="shortcut icon" href="/img/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/img/site.webmanifest" />
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/site.css">
</head>

<body>
  <a href="#main" class="sr-only">Перейти к содержимому</a>

  <header>
    <div class="header-cont">
      <h1 class="logo-wrap"><a href="/" class="logo" aria-label="Глас — на главную">Глас <span>•</span> <em>Православные новости</em></a></h1>

      <button id="themeToggle" class="theme-toggle" aria-label="Переключить тему" type="button"></button>
    </div>
  </header>

  <main id="main">
    <section class="filters" aria-label="Фильтры новостей">
      <div class="filters__row">
        <div class="filter-group" style="display:none">
          <label for="jurisdictionFilter">Юрисдикция</label>
          <select id="jurisdictionFilter">
            <option value="">Все</option>
          </select>
        </div>
        <div class="filter-group" style="display:none">
          <label for="countryFilter">Страна</label>
          <select id="countryFilter">
            <option value="">Все</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="sourceFilter">Источник</label>
          <select id="sourceFilter">
            <option value="">Все источники</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="dateFilter">Период</label>
          <select id="dateFilter">
            <option value="">Все всё время</option>
            <option value="today">Сегодня</option>
            <option value="yesterday">Вчера</option>
          </select>
        </div>

        <div class="filter-group filter-group--search">
          <label for="searchInput">Поиск по заголовку</label>
          <input id="searchInput" type="search" placeholder="Поиск по заголовку">
        </div>
      </div>
    </section>

    <section class="news-feed" aria-live="polite">
      <div id="newsList" class="news-grid">
        <div class="skeleton-card">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
        </div>
      </div>
    </section>

    <footer class="pager">
      <button id="prevPage" type="button">&larr; Назад</button>
      <span id="pageInfo"></span>
      <button id="nextPage" type="button">Вперёд &rarr;</button>
    </footer>
  </main>

  <footer class="site-footer">
    <h1>Глас — Православные новости в одной ленте</h1>
    <p>Патриархия, епархии, церковные СМИ — свежие новости за 1–2 минуты. Полный текст открывается на сайте
      первоисточника.
    </p>
  </footer>

  <script src="js/site.js"></script>
</body>

</html>
